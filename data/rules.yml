version: "3.1"

rules:

- rule: Say greet anytime the user says hello
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Respond to how are you
  steps:
  - intent: smalltalk_how_are_you
  - action: utter_smalltalk_how_are_you

- rule: Respond to acknowledgement
  steps:
  - intent: smalltalk_ack
  - action: utter_smalltalk_ack

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Handle out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Handle crime confession
  steps:
  - intent: confess_crime
  - action: action_handle_crime_confession
  - action: utter_crime_confession
  - action: action_query_crime

- rule: Respond to ask_about_crime
  steps:
  - intent: ask_about_crime
  - action: action_query_crime

- rule: Respond to ask_about_punishment
  steps:
  - intent: ask_about_punishment
  - action: action_query_crime

- rule: Respond to ask_about_ipc
  steps:
  - intent: ask_about_ipc
  - action: action_query_ipc_section

- rule: Respond to ask_ipc_punishment
  steps:
  - intent: ask_ipc_punishment
  - action: action_query_ipc_punishment

- rule: Respond to describe_case with IPC suggestions
  steps:
  - intent: describe_case
  - action: action_suggest_ipc_from_description
